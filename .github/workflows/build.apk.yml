name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Create fresh Flutter project structure
      run: |
        flutter create . --org com.keshav.cyber --project-name keshav_online_cyber --platforms=android
        mkdir -p assets
        # Agar logo aur main.dart pehle se hain toh unhe overwrite hone se bachane ke liye yeh steps hain

    - run: flutter pub get
    - run: flutter build apk --release

    - uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
